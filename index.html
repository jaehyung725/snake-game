<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>지렁이 게임 (Snake Game)</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        body {
            background: linear-gradient(135deg, #1e293b, #0f172a);
            color: #f8fafc;
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 16px;
        }

        .game-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            background: rgba(30, 41, 59, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(12px);
            border-radius: 20px;
            padding: 24px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
        }

        h1 {
            font-size: 1.8rem;
            margin-bottom: 12px;
            font-weight: 700;
            letter-spacing: -0.5px;
            color: #38bdf8;
            text-shadow: 0 0 12px rgba(56, 189, 248, 0.4);
        }

        .header {
            display: flex;
            justify-content: space-between;
            width: 400px;
            margin-bottom: 16px;
            font-size: 1rem;
            font-weight: 600;
        }

        .badge {
            background: #334155;
            padding: 6px 14px;
            border-radius: 9999px;
            border: 1px solid #475569;
        }

        .badge span {
            color: #38bdf8;
        }

        .canvas-wrapper {
            position: relative;
            border-radius: 12px;
            overflow: hidden;
            border: 2px solid #334155;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3);
        }

        canvas {
            display: block;
            background-color: #020617;
        }

        .overlay {
            position: absolute;
            inset: 0;
            background: rgba(2, 6, 23, 0.85);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 16px;
            backdrop-filter: blur(4px);
        }

        .overlay.hidden {
            display: none;
        }

        .overlay h2 {
            font-size: 1.7rem;
            color: #ef4444;
        }

        .btn {
            background: linear-gradient(135deg, #0284c7, #0369a1);
            color: white;
            border: none;
            padding: 10px 24px;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 4px 12px rgba(2, 132, 199, 0.3);
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(2, 132, 199, 0.5);
            background: linear-gradient(135deg, #0ea5e9, #0284c7);
        }

        .btn:active {
            transform: translateY(0);
        }

        .controls-info {
            margin-top: 16px;
            font-size: 0.85rem;
            color: #94a3b8;
            text-align: center;
            line-height: 1.5;
        }

        /* 모바일/터치용 가상 패드 */
        .touch-controls {
            margin-top: 16px;
            display: grid;
            grid-template-columns: repeat(3, 54px);
            grid-template-rows: repeat(2, 54px);
            gap: 8px;
            justify-content: center;
        }

        .pad-btn {
            background: #334155;
            border: 1px solid #475569;
            color: #f8fafc;
            border-radius: 12px;
            font-size: 1.2rem;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: background 0.15s;
        }

        .pad-btn:active {
            background: #0ea5e9;
        }

        .pad-up { grid-column: 2; grid-row: 1; }
        .pad-left { grid-column: 1; grid-row: 2; }
        .pad-down { grid-column: 2; grid-row: 2; }
        .pad-right { grid-column: 3; grid-row: 2; }
    </style>
</head>
<body>

<div class="game-container">
    <h1>🐍 지렁이 게임</h1>
    
    <div class="header">
        <div class="badge">점수: <span id="currentScore">0</span></div>
        <div class="badge">최고 점수: <span id="highScore">0</span></div>
    </div>

    <div class="canvas-wrapper">
        <canvas id="gameCanvas" width="400" height="400"></canvas>
        <div id="overlay" class="overlay">
            <h2 id="overlayTitle">지렁이 게임</h2>
            <button id="startBtn" class="btn">게임 시작</button>
        </div>
    </div>

    <div class="controls-info">
        방향키(↑, ↓, ←, →) 또는 W, A, S, D 키로 조작하세요.<br>
        먹이를 먹으면 길이가 늘어나고 속도가 빨라집니다!
    </div>

    <div class="touch-controls">
        <button class="pad-btn pad-up" onclick="handleDirection('UP')">▲</button>
        <button class="pad-btn pad-left" onclick="handleDirection('LEFT')">◀</button>
        <button class="pad-btn pad-down" onclick="handleDirection('DOWN')">▼</button>
        <button class="pad-btn pad-right" onclick="handleDirection('RIGHT')">▶</button>
    </div>
</div>

<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const currentScoreEl = document.getElementById('currentScore');
    const highScoreEl = document.getElementById('highScore');
    const overlay = document.getElementById('overlay');
    const overlayTitle = document.getElementById('overlayTitle');
    const startBtn = document.getElementById('startBtn');

    const GRID_SIZE = 20;
    const TILE_COUNT = canvas.width / GRID_SIZE;

    let snake = [];
    let food = { x: 0, y: 0 };
    let dx = 0;
    let dy = 0;
    let nextDx = 0;
    let nextDy = 0;
    let score = 0;
    let highScore = localStorage.getItem('snake_high_score') || 0;
    let gameLoopTimeout = null;
    let isGameOver = false;
    let isRunning = false;
    let baseSpeed = 130;

    highScoreEl.innerText = highScore;

    function resetGame() {
        snake = [
            { x: 10, y: 10 },
            { x: 10, y: 11 },
            { x: 10, y: 12 }
        ];
        dx = 0;
        dy = -1;
        nextDx = 0;
        nextDy = -1;
        score = 0;
        baseSpeed = 130;
        currentScoreEl.innerText = score;
        spawnFood();
        isGameOver = false;
    }

    function spawnFood() {
        while (true) {
            food.x = Math.floor(Math.random() * TILE_COUNT);
            food.y = Math.floor(Math.random() * TILE_COUNT);

            // 지렁이 몸통과 겹치는지 체크
            const collision = snake.some(part => part.x === food.x && part.y === food.y);
            if (!collision) break;
        }
    }

    function update() {
        dx = nextDx;
        dy = nextDy;

        const head = { x: snake[0].x + dx, y: snake[0].y + dy };

        // 벽 충돌 검사
        if (head.x < 0 || head.x >= TILE_COUNT || head.y < 0 || head.y >= TILE_COUNT) {
            return gameOver();
        }

        // 몸통 충돌 검사
        if (snake.some(part => part.x === head.x && part.y === head.y)) {
            return gameOver();
        }

        snake.unshift(head);

        // 먹이 섭취 확인
        if (head.x === food.x && head.y === food.y) {
            score += 10;
            currentScoreEl.innerText = score;
            if (score > highScore) {
                highScore = score;
                highScoreEl.innerText = highScore;
                localStorage.setItem('snake_high_score', highScore);
            }
            // 속도 점진적 증가
            if (baseSpeed > 60) baseSpeed -= 2;
            spawnFood();
        } else {
            snake.pop();
        }

        draw();
        gameLoopTimeout = setTimeout(update, baseSpeed);
    }

    function draw() {
        // 배경 그리기
        ctx.fillStyle = '#020617';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        // 그리드 패턴 효과
        ctx.strokeStyle = '#0f172a';
        ctx.lineWidth = 1;
        for (let i = 0; i < canvas.width; i += GRID_SIZE) {
            ctx.beginPath();
            ctx.moveTo(i, 0);
            ctx.lineTo(i, canvas.height);
            ctx.stroke();

            ctx.beginPath();
            ctx.moveTo(0, i);
            ctx.lineTo(canvas.width, i);
            ctx.stroke();
        }

        // 먹이 그리기 (애플 레드)
        ctx.fillStyle = '#f43f5e';
        ctx.shadowColor = '#f43f5e';
        ctx.shadowBlur = 10;
        ctx.beginPath();
        ctx.arc(
            food.x * GRID_SIZE + GRID_SIZE / 2,
            food.y * GRID_SIZE + GRID_SIZE / 2,
            GRID_SIZE / 2 - 2,
            0,
            Math.PI * 2
        );
        ctx.fill();
        ctx.shadowBlur = 0; // 초기화

        // 지렁이 그리기
        snake.forEach((part, index) => {
            if (index === 0) {
                // 머리
                ctx.fillStyle = '#38bdf8';
                ctx.shadowColor = '#38bdf8';
                ctx.shadowBlur = 8;
            } else {
                // 몸통 (그라데이션 느낌)
                const ratio = index / snake.length;
                ctx.fillStyle = `hsl(${190 - ratio * 40}, 80%, ${55 - ratio * 15}%)`;
                ctx.shadowBlur = 0;
            }

            ctx.beginPath();
            ctx.roundRect(
                part.x * GRID_SIZE + 1.5,
                part.y * GRID_SIZE + 1.5,
                GRID_SIZE - 3,
                GRID_SIZE - 3,
                index === 0 ? 6 : 4
            );
            ctx.fill();
            ctx.shadowBlur = 0;
        });
    }

    function gameOver() {
        isGameOver = true;
        isRunning = false;
        overlayTitle.innerText = `게임 오버! (점수: ${score}점)`;
        startBtn.innerText = '다시 도전';
        overlay.classList.remove('hidden');
    }

    function startGame() {
        resetGame();
        overlay.classList.add('hidden');
        isRunning = true;
        if (gameLoopTimeout) clearTimeout(gameLoopTimeout);
        update();
    }

    function handleDirection(direction) {
        if (!isRunning) return;

        switch (direction) {
            case 'UP':
                if (dy !== 1) { nextDx = 0; nextDy = -1; }
                break;
            case 'DOWN':
                if (dy !== -1) { nextDx = 0; nextDy = 1; }
                break;
            case 'LEFT':
                if (dx !== 1) { nextDx = -1; nextDy = 0; }
                break;
            case 'RIGHT':
                if (dx !== -1) { nextDx = 1; nextDy = 0; }
                break;
        }
    }

    window.addEventListener('keydown', (e) => {
        if (!isRunning && (e.code === 'Space' || e.code === 'Enter')) {
            startGame();
            return;
        }

        switch (e.key) {
            case 'ArrowUp':
            case 'w':
            case 'W':
                handleDirection('UP');
                e.preventDefault();
                break;
            case 'ArrowDown':
            case 's':
            case 'S':
                handleDirection('DOWN');
                e.preventDefault();
                break;
            case 'ArrowLeft':
            case 'a':
            case 'A':
                handleDirection('LEFT');
                e.preventDefault();
                break;
            case 'ArrowRight':
            case 'd':
            case 'D':
                handleDirection('RIGHT');
                e.preventDefault();
                break;
        }
    });

    startBtn.addEventListener('click', startGame);

    // 초기 화면 드로우
    resetGame();
    draw();
</script>
</body>
</html>
